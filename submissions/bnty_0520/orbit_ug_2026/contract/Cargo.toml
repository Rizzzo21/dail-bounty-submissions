[package]
name = "orbit-ritual"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "=5.17.2", features = ["legacy"] }
serde = { version = "1.0", features = ["derive"] }
borsh = { version = "1.4", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true
